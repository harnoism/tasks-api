name: dockers

on: 
  push:
    branches: 
      - main
    tags: 
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
     
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lancer les tests
        run: pytest --cov=app --cov-fail-under=80 --cov-report=xml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: owner name
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Calculate app version
        id: app_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/tasks-api
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.version }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: owner name
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Connexion au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simuler le déploiement Staging (Run conteneur)
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          docker run -d --name tasks-api-staging -p 8000:8000 ghcr.io/${{ steps.repo_owner.outputs.owner }}/tasks-api:sha-$SHA_SHORT
      - name: Test de fumée (Smoke test)
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/version 

  deploy-production:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   
    steps:
      - name: owner name
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Calculate app version
        id: app_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

      - name: Connexion au registre GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simuler le déploiement Staging (Run conteneur)
        run: |
          docker run -d --name tasks-api-prod -p 8000:8000 ghcr.io/${{ steps.repo_owner.outputs.owner }}/tasks-api:${{ steps.app_version.outputs.version }}
      - name: Test de fumée (Smoke test)
        run: |
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done
          curl -fsS http://localhost:8000/version 

  update-config:
      needs: deploy-production
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      permissions:
        contents: read
      env:
        VERSION: ${{ github.ref_name }}   # ex. v0.2.0
      steps:
        - name: Récupérer le dépôt applicatif
          uses: actions/checkout@v6

        - name: Récupérer le dépôt de configuration
          uses: actions/checkout@v6
          with:
            repository: harnoism/tasks-config
            token: ${{ secrets.CONFIG_REPO_TOKEN }}
            path: config

        - name: Mettre à jour la version de l'image
          run: bash scripts/set-image-tag.sh config/config-repo/k8s/deployment.yaml "${VERSION#v}"

        - name: Commiter et pousser dans tasks-config
          run: |
            cd config
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@://github.com"
            # ⚠️ Ajout du préfixe config-repo/ pour Git
            git add config-repo/k8s/deployment.yaml
            git commit -m "Déploiement de tasks-api ${VERSION#v}"
            git push



        