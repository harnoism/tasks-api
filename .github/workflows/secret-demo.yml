name: Secret 

on:
  workflow_dispatch:

jobs:
  display-demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Verifier et manipuler le secret
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Le secret est absent !"; exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"

      - name: Essayer d'afficher la valeur brute du secret
        run: |
          echo "Tentative d'affichage de la valeur : ${{ secrets.DEMO_TOKEN }}"

      - name: Afficher la variable d'environnement
        run: |
          echo "L'environnement actuel est : ${{ vars.APP_ENV }}"